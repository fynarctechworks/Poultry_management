name: CI

# Runs the existing test suites on every push and PR:
#   • jest   — React Native component/logic tests (mobile-app + tests/components)
#   • deno   — Edge Function pure-logic tests (tests/functions + supabase/functions/tests)
#   • pgtap  — Postgres RLS / trigger / tenant-isolation tests (tests/db + supabase/tests)
# Jobs run in parallel and are independent; a red job blocks the merge.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

# Newer runs supersede in-flight ones for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Mobile component + logic tests (jest-expo). Picks up mobile-app/**/*.test.*
  # and ../tests/components/* via mobile-app/jest.config.js.
  # ---------------------------------------------------------------------------
  jest:
    name: jest (mobile components)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci
      - name: Run jest
        working-directory: mobile-app
        run: npm test

  # ---------------------------------------------------------------------------
  # Edge Function logic tests. These exercise extracted pure functions (HMAC
  # verification, payload parsing, keyword detection) — no running server needed.
  # ---------------------------------------------------------------------------
  deno:
    name: deno (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run deno tests
        run: deno test --allow-env --allow-net --allow-read tests/functions/ supabase/functions/tests/

  # ---------------------------------------------------------------------------
  # Database tests (pgTAP). Spins up the local Supabase stack (applies all
  # migrations + seed, enables pgtap), then runs every *.test.sql with pg_prove.
  # Each test wraps itself in BEGIN/ROLLBACK, so the DB is left untouched.
  # ---------------------------------------------------------------------------
  pgtap:
    name: pgtap (db / RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (db + migrations + seed)
        run: supabase start

      - name: Install pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      # ---------------------------------------------------------------------------
      # pgTAP is installed in the `extensions` schema (20260519000001_enable_pgtap).
      # `pg_prove` spawns its OWN `psql` child process, and the Supabase Postgres
      # image does not put `extensions` on the default search_path — so the bare
      # pgTAP functions (plan()/ok()/is()/throws_ok()/finish()) resolve to
      # "function does not exist" and every file dies with "No plan found".
      #
      # The previous fix passed PGOPTIONS=-c search_path=... as a step env var. That
      # is unreliable here: it depends on the variable surviving into pg_prove's
      # grandchild psql, which it did not (CI run #4 still failed). Pin the
      # search_path on the DATABASE instead — that default is applied to EVERY new
      # connection (pg_prove's psql included), independent of role or environment.
      # This touches only the ephemeral CI database, never production (prod schema
      # is driven by migrations, which intentionally do NOT alter runtime search_path).
      # ---------------------------------------------------------------------------
      - name: Configure pgTAP search_path + pre-flight sanity
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE postgres SET search_path TO public, extensions;"
          # Fail fast (with a clear signal) if pgTAP is not actually resolvable on a
          # fresh connection. After this passes, a red suite can only be a real
          # assertion failure — never an ambiguous infra/search_path problem again.
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'pgtap';" \
            -c "SELECT plan(1); SELECT ok(true, 'pgTAP resolves on a fresh connection'); SELECT * FROM finish();"

      - name: Run pgTAP suite
        env:
          PGPASSWORD: postgres
        run: |
          set -uo pipefail
          pg_prove --verbose \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            tests/db/*.test.sql supabase/tests/*.test.sql 2>&1 | tee /tmp/pgtap.out
          rc=${PIPESTATUS[0]}
          # Surface the actual failing assertions as a workflow ERROR annotation —
          # readable via the public check-runs annotations API (logs are admin-only).
          # Does NOT suppress the failure: we re-exit with pg_prove's exit code.
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -nE '^not ok|^# |^ok [0-9]+ - .*(ERROR|fail)|Wstat|Result:|ERROR:|FATAL:|does not exist|No plan|Failed test' /tmp/pgtap.out | head -60)
            enc=$(printf '%s' "$msg" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=pgTAP failures::${enc}"
          fi
          exit $rc

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
