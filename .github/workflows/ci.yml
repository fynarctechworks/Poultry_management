name: CI

# Runs the existing test suites on every push and PR:
#   • jest   — React Native component/logic tests (mobile-app + tests/components)
#   • deno   — Edge Function pure-logic tests (tests/functions + supabase/functions/tests)
#   • pgtap  — Postgres RLS / trigger / tenant-isolation tests (tests/db + supabase/tests)
# Jobs run in parallel and are independent; a red job blocks the merge.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

# Newer runs supersede in-flight ones for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Mobile component + logic tests (jest-expo). Picks up mobile-app/**/*.test.*
  # and ../tests/components/* via mobile-app/jest.config.js.
  # ---------------------------------------------------------------------------
  jest:
    name: jest (mobile components)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci
      - name: Run jest
        working-directory: mobile-app
        run: npm test

  # ---------------------------------------------------------------------------
  # Edge Function logic tests. These exercise extracted pure functions (HMAC
  # verification, payload parsing, keyword detection) — no running server needed.
  # ---------------------------------------------------------------------------
  deno:
    name: deno (edge functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run deno tests
        run: deno test --allow-env --allow-net --allow-read tests/functions/ supabase/functions/tests/

  # ---------------------------------------------------------------------------
  # Database tests (pgTAP). Spins up the local Supabase stack (applies all
  # migrations + seed, enables pgtap), then runs every *.test.sql with pg_prove.
  # Each test wraps itself in BEGIN/ROLLBACK, so the DB is left untouched.
  # ---------------------------------------------------------------------------
  pgtap:
    name: pgtap (db / RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (db + migrations + seed)
        run: supabase start

      - name: Install pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: Run pgTAP suite
        env:
          PGPASSWORD: postgres
          # pgTAP lives in the `extensions` schema (20260519000001_enable_pgtap).
          # The postgres role pg_prove connects as does not reliably have
          # `extensions` on its search_path in CI, so plan()/ok()/etc. resolve to
          # "function does not exist" and every file fails with "No plan found".
          # Force it on the connection so the assertions are visible.
          PGOPTIONS: "-c search_path=public,extensions"
        run: |
          pg_prove --verbose \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            tests/db/*.test.sql supabase/tests/*.test.sql

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
