[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
image_transformation.enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# SEC-3: was 6 (weak). 8 + complexity is the local-dev policy.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"
# Leaked-password protection (HaveIBeenPwned) is a HOSTED Auth setting that
# config.toml does NOT control. It is currently OFF on the live project (flagged
# by the security advisor `auth_leaked_password_protection`). Enable it in the
# Supabase dashboard: Authentication > Policies > "Leaked password protection".

# Multi-factor authentication. Without this block the local GoTrue defaults to
# enroll_enabled = false, which makes POST /auth/v1/factors return 422.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Production-ready: require a real email confirmation before the account is
# usable. Locally, GoTrue delivers to Inbucket (http://127.0.0.1:54324) so the
# flow is fully testable without a provider. The dev-verify shortcut is REMOVED.
enable_confirmations = true

# Branded GoTrue email templates (shared visual system with the Layer-2
# send-email engine). Paths are relative to the supabase/ directory.
[auth.email.template.confirmation]
subject = "Confirm your PoultryOS email"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your PoultryOS password"
content_path = "./templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new PoultryOS email"
content_path = "./templates/email-change.html"

[auth.email.template.magic_link]
subject = "Your PoultryOS sign-in link"
content_path = "./templates/magic-link.html"

[auth.email.template.invite]
subject = "You've been invited to PoultryOS"
content_path = "./templates/invite.html"

# -----------------------------------------------------------------------------
# Production SMTP via Resend. Keep enabled = false for LOCAL dev (so emails land
# in Inbucket). On the HOSTED project this is configured in the dashboard
# (Authentication > Emails > SMTP) — see docs/email/dns-setup.md. To send real
# email from a LOCAL stack, set RESEND_SMTP_PASSWORD in supabase/.env and flip
# enabled = true.
# -----------------------------------------------------------------------------
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "noreply@poultryosadmin.infynarc.com"
sender_name = "PoultryOS"
